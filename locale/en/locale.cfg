[controls]
trash-slot-delete=Trash stack
trash-slot-delete-all=Trash all of that item

[controls-description]
trash-slot-delete=Throws the stack you hold (or hover in your inventory) into the trash slot. What was in the slot before is destroyed (the undo button beside the slot brings back the last one).
trash-slot-delete-all=Throws every stack of the held or hovered item (same quality) into the trash slot.

[trash-slot]
slot-tooltip=[font=default-bold]Trash slot[/font]\nClick: take the stack back\nShift-click: take everything back into your inventory\nRight-click: destroy it\nClick while holding a stack: trash it\nDelete: destroy it\nThe last thing destroyed comes back with the undo button beside the slot.
slot-tooltip-drag=[font=default-bold]Trash slot[/font]\nClick: take the stack back\nShift-click: take everything back into your inventory\nRight-click: destroy it\nClick while holding a stack: trash it\nDelete: destroy it\nDrag: put it anywhere on the screen\nThe last thing destroyed comes back with the undo button beside the slot.
move-tooltip=Next place: left, bottom, right or top of the window, or floating
bar-tooltip=Drag to move
stack=__1__ __2__ ×__3__
destroyed=Destroyed __1__ (undo: the button beside the trash slot)
undo-tooltip=[font=default-bold]Undo[/font]\nPut __1__ back into your inventory
undo-full=Your inventory is full: the rest stays in the undo
