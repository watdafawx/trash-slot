[controls]
trash-slot-delete=Trash stack
trash-slot-delete-all=Trash all of that item

[controls-description]
trash-slot-delete=Throws the stack you hold (or hover in your inventory) into the trash slot. What was in the slot before is destroyed.
trash-slot-delete-all=Throws every stack of the held or hovered item (same quality) into the trash slot.

[trash-slot]
slot-tooltip=[font=default-bold]Trash slot[/font]\nClick: take the stack back\nShift-click: take everything back into your inventory\nRight-click: destroy now\nClick while holding a stack: trash it\nDelete: destroy it for good
slot-tooltip-drag=[font=default-bold]Trash slot[/font]\nClick: take the stack back\nShift-click: take everything back into your inventory\nRight-click: destroy now\nClick while holding a stack: trash it\nDelete: destroy it for good\nDrag: put it anywhere on the screen
move-tooltip=Next place: left, bottom, right or top of the window, or floating
bar-tooltip=Drag to move
